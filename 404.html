<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | NOX</title>
  <link rel="icon" type="image/png" href="./images/Subtract.png" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }
    .error-container {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .error-code {
      font-size: 80px;
      font-weight: 800;
      color: var(--primary-color, #f4b41a);
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(244, 180, 26, 0.3);
    }
    .error-title {
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 15px;
    }
    .error-msg {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .home-btn {
      display: inline-block;
      background: var(--primary-color, #f4b41a);
      color: #000;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .home-btn:hover {
      background: #e0a312;
      color: #000;
      text-decoration: none;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <div class="error-title">Drinks not found!</div>
    <div class="error-msg">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</div>
    <a href="/" class="home-btn">Return Home</a>
  </div>
</body>
</html>
